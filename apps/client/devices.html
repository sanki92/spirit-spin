<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Device wall</title>
<style>
  body { margin: 0; background: #1b1d24; font-family: system-ui, sans-serif; color: #ccd; }
  .wall { display: flex; flex-wrap: wrap; gap: 18px; padding: 16px; }
  figure { margin: 0; display: grid; gap: 6px; }
  figcaption { font-size: 13px; font-weight: 600; }
  .phone { width: calc(390px * var(--s)); height: calc(844px * var(--s)); overflow: hidden; border-radius: 22px; box-shadow: 0 0 0 6px #000, 0 10px 30px #0008; }
  iframe { width: 390px; height: 844px; border: 0; transform: scale(var(--s)); transform-origin: 0 0; background: #000; }
</style>
</head>
<body>
<div class="wall" id="wall"></div>
<script>
  const q = new URLSearchParams(location.search)
  const screens = (q.get('s') || 'home,result-win,result-loss,profile').split(',')
  const s = Number(q.get('scale') || 0.62)
  const wall = document.getElementById('wall')
  for (const k of screens) {
    const f = document.createElement('figure')
    f.innerHTML = `<figcaption>${k}</figcaption><div class="phone" style="--s:${s}"><iframe loading="eager" src="/?sim&still&screen=${encodeURIComponent(k)}"></iframe></div>`
    wall.appendChild(f)
  }
</script>
</body>
</html>
